<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Order Tracking - Kate's</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#FFF5F8] p-6"><h1 class="text-2xl font-black mb-4">Order Tracking</h1><div id="list"></div><script>const orders=JSON.parse(localStorage.getItem('kate_orders')||'[]');const el=document.getElementById('list');if(!orders.length)el.innerHTML='<p>No orders</p>';else el.innerHTML=orders.map(o=>`<div class="bg-white p-3 rounded-xl mb-2"><div>Order #${o.id}</div><div>Status: ${o.status}</div><div>Products: ${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</div></div>`).join('');</script></body></html>
