<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Kate's Original Gadgets</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{pinktheme:{50:'#FFF5F8',100:'#FCEEF2',200:'#F8DDE5',300:'#F3C0D0',400:'#E297AF',500:'#C86D8B',600:'#9E4665',700:'#7B314E',800:'#592037',900:'#3D1223'}},fontFamily:{sans:['Plus Jakarta Sans','Inter','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#FFF5F8;color:#592037}
.in{width:100%;padding:.55rem .75rem;background:#FFF9FB;border:1px solid #F8DDE5;border-radius:.75rem;font-size:12px;outline:none}.in:focus{border-color:#9E4665;background:#fff}
.lb{display:block;font-size:11px;font-weight:700;margin-bottom:.25rem}.btn{padding:.5rem .9rem;border-radius:.75rem;font-size:12px;font-weight:700;transition:.15s}
.p{background:#7B314E;color:#fff}.p:hover{background:#592037}.s{background:#fff;border:1px solid #F8DDE5}.s:hover{background:#FCEEF2}
.card{background:#fff;border:1px solid #F8DDE5;border-radius:1.25rem}.th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#9E4665;text-align:left;padding:.6rem .75rem;white-space:nowrap}.td{padding:.6rem .75rem;font-size:12px;border-top:1px solid #FCEEF2}
.chip{font-size:10px;font-weight:800;padding:.15rem .55rem;border-radius:99px;white-space:nowrap}</style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-30 bg-pinktheme-50/90 backdrop-blur border-b border-pinktheme-200">
 <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
  <div class="flex items-center gap-3"><img src="kate.jpg" class="h-10 rounded-lg" alt="Kate's"><div class="leading-tight"><b class="text-sm">Staff Dashboard</b><span class="block text-[10px] text-pinktheme-600">Products · Inventory · Inquiries · Sales</span></div></div>
  <a href="index.html" class="btn s"><i class="fa-solid fa-store mr-1"></i> View storefront</a>
 </div>
 <nav id="tabs" class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto pb-2"></nav>
</header>
<main id="main" class="max-w-7xl mx-auto px-4 py-6"></main>
<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(89,32,55,.4);backdrop-filter:blur(6px)"></div>
<div id="toast" class="fixed bottom-4 right-4 z-[60] bg-pinktheme-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-lg hidden"></div>

<script>
const CATS=['smartphones','smartwatches','audio','tablets','accessories'],CONDS=['Brand New','Grade A – Like New','Grade B – Good','Grade C – Fair'];
const SEED=[
[1,'iPhone 16 (Pre-Owned)','smartphones',45990,49990,'iphone16.webp','Grade A – Like New',4,'Pre-owned iPhone 16 in excellent condition, store-tested with warranty.','Storage: 128GB\nBattery health: 94%\nUnlocked: Yes'],
[2,'2025 Apple Watch SE Sport Band (3rd Gen - Starlight)','smartwatches',15490,17990,'watchse3.webp','Brand New',9,'Apple Watch SE with Sport Band in Starlight.','Case: 44mm\nConnectivity: GPS'],
[3,'AirPods Max (USB-C - Midnight)','audio',32990,35990,'airpodmax2.webp','Brand New',3,'Over-ear headphones with Active Noise Cancellation.','Port: USB-C\nColor: Midnight'],
[4,'20W USB-C Power Adapter','accessories',990,1290,'20wusbc.webp','Brand New',40,'Fast, efficient charging at home or on the go.','Output: 20W\nPort: USB-C'],
[5,'13-inch iPad Pro M5 (256GB Space Black)','tablets',109990,114990,'ipadprom5.webp','Brand New',2,'The thinnest iPad with the M5 chip.','Chip: M5\nStorage: 256GB\nDisplay: 13-inch'],
[6,'AirPods Pro 3','audio',14290,16990,'airpodpro3.webp','Brand New',0,'Next-gen ANC with a better fit.','ANC: Yes\nCase: USB-C']];
var $=s=>document.querySelector(s),peso=n=>'₱'+Number(n||0).toLocaleString('en-US'),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
fd=d=>new Date(d).toLocaleDateString('en-PH',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
var P,O,Q,view=(location.hash||'#overview').slice(1),sel=null,qf='all',range=30,pq='';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2500)}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Storage full – use a smaller photo');return false}}
function reload(){O=load('kate_orders',[]);Q=load('kate_inquiries',[]);P=load('kate_catalog',null);
 if(!P){P=SEED.map(s=>({id:s[0],sku:'KOG-'+String(s[0]).padStart(3,'0'),name:s[1],category:s[2],price:s[3],originalPrice:s[4],image:s[5],condition:s[6],stock:s[7],lowAt:3,status:'published',badge:'',rating:4.8,reviewsCount:100,description:s[8],specs:s[9]}));
  O.filter(o=>!o.demo&&o.status!='cancelled').forEach(o=>o.items.forEach(i=>{const p=P.find(x=>x.id==i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)}));put('kate_catalog',P)}}
const live=()=>O.filter(o=>o.status!='cancelled'),sum=a=>a.reduce((t,o)=>t+o.total,0);
const avail=p=>p.stock<=0?['Out of stock','bg-red-100 text-red-700']:p.stock<=p.lowAt?['Low stock','bg-amber-100 text-amber-700']:['In stock','bg-emerald-100 text-emerald-700'];
const kpi=(l,v,i,sub='')=>`<div class="card p-4"><div class="flex justify-between text-pinktheme-600 text-[11px] font-bold uppercase">${l}<i class="fa-solid ${i}"></i></div><div class="text-2xl font-black mt-1">${v}</div><div class="text-[11px] text-pinktheme-600/70">${sub}</div></div>`;
const bars=(days,h=140)=>{const m=Math.max(1,...days.map(d=>d.v));return `<div class="flex items-end gap-1" style="height:${h}px">${days.map(d=>`<div class="flex-1 group relative bg-pinktheme-100 rounded-t" style="height:${Math.max(2,d.v/m*100)}%" title="${d.l}: ${peso(d.v)}"><div class="absolute inset-0 rounded-t bg-pinktheme-600 opacity-80 group-hover:opacity-100"></div></div>`).join('')}</div><div class="flex justify-between text-[10px] text-pinktheme-600/70 mt-1"><span>${days[0].l}</span><span>${days[days.length-1].l}</span></div>`};
function daily(n,list){const out=[];for(let i=n-1;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=dk(d);out.push({l:d.toLocaleDateString('en-PH',{month:'short',day:'numeric'}),v:sum(list.filter(o=>dk(o.createdAt)==k))})}return out}
const empty=(t)=>`<div class="text-center text-xs text-pinktheme-600/70 py-8">${t}</div>`;
const sampleBanner=()=>O.some(o=>o.demo)||Q.some(q=>q.demo)?`<div class="mb-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs flex justify-between items-center gap-2"><span><b>Sample data is loaded.</b> Orders and inquiries marked “sample” are not real.</span><button class="btn s" onclick="clearSample()">Remove sample data</button></div>`:'';

const V={
overview(){const l=live(),low=P.filter(p=>p.stock<=p.lowAt),nq=Q.filter(q=>q.status=='new');
 const noData=!O.length&&!Q.length?`<div class="card p-5 mb-4 flex flex-wrap items-center justify-between gap-3"><div><b class="text-sm">No orders or inquiries yet</b><p class="text-xs text-pinktheme-600">Real orders and support tickets from the storefront will appear here. Want to see how it looks filled in?</p></div><button class="btn p" onclick="addSample()">Load sample data</button></div>`:'';
 return `${noData}${sampleBanner()}<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpi('Revenue',peso(sum(l)),'fa-peso-sign',l.length+' orders')}${kpi('Active products',P.filter(p=>p.status=='published').length,'fa-box',P.length+' total listings')}${kpi('Needs restock',low.length,'fa-triangle-exclamation','low or out of stock')}${kpi('New inquiries',nq.length,'fa-envelope','awaiting reply')}</div>
 <div class="grid lg:grid-cols-3 gap-4"><div class="card p-5 lg:col-span-2"><b class="text-sm">Revenue · last 14 days</b><div class="mt-4">${bars(daily(14,l))}</div></div>
 <div class="card p-5"><b class="text-sm">Stock alerts</b><div class="mt-2">${low.length?low.map(p=>`<div class="flex justify-between items-center py-2 border-t border-pinktheme-100 first:border-0 text-xs"><span class="truncate pr-2">${esc(p.name)}</span><span class="chip ${avail(p)[1]}">${p.stock} left</span></div>`).join(''):empty('All stock levels look healthy.')}</div></div>
 <div class="card p-5 lg:col-span-3"><div class="flex justify-between"><b class="text-sm">Latest inquiries</b><a href="#inquiries" class="text-xs font-bold text-pinktheme-600 underline">Open inbox</a></div>${Q.length?Q.slice(0,4).map(q=>`<div class="flex justify-between gap-3 py-2 border-t border-pinktheme-100 text-xs"><span><b>${esc(q.name)}</b> · ${esc(q.concern)}<span class="block text-pinktheme-600/70 truncate max-w-xl">${esc(q.message)}</span></span>${stChip(q.status)}</div>`).join(''):empty('No inquiries yet.')}</div></div>`},

products(){const l=P.filter(p=>p.name.toLowerCase().includes(pq));
 return `${''}<div class="flex flex-wrap gap-2 justify-between mb-4"><input class="in max-w-xs" placeholder="Search products…" value="${esc(pq)}" oninput="pq=this.value.toLowerCase();render(true)" id="ps"><button class="btn p" onclick="editP()"><i class="fa-solid fa-plus mr-1"></i> Add product</button></div>
 <div class="card overflow-x-auto"><table class="w-full"><thead><tr><th class="th">Product</th><th class="th">Category</th><th class="th">Condition</th><th class="th">Price</th><th class="th">Stock</th><th class="th">Listing</th><th class="th"></th></tr></thead><tbody>${l.map(p=>`<tr><td class="td"><div class="flex items-center gap-2"><img src="${esc(p.image)}" class="w-10 h-10 rounded-lg object-cover bg-pinktheme-50 border border-pinktheme-100"><span><b class="block max-w-[240px] truncate">${esc(p.name)}</b><span class="text-[10px] text-pinktheme-600/70">${esc(p.sku)}</span></span></div></td><td class="td capitalize">${p.category}</td><td class="td">${p.condition}</td><td class="td font-bold">${peso(p.price)}</td><td class="td"><span class="chip ${avail(p)[1]}">${p.stock}</span></td><td class="td"><span class="chip ${p.status=='published'?'bg-emerald-100 text-emerald-700':'bg-gray-100 text-gray-600'}">${p.status}</span></td><td class="td text-right whitespace-nowrap"><button class="btn s" onclick="editP(${p.id})"><i class="fa-solid fa-pen"></i></button> <button class="btn s text-red-600" onclick="delP(${p.id})"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('')||`<tr><td colspan="7">${empty('No products found.')}</td></tr>`}</tbody></table></div>`},

inventory(){const units=P.reduce((t,p)=>t+p.stock,0),val=P.reduce((t,p)=>t+p.stock*p.price,0);
 return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpi('Units on hand',units,'fa-cubes')}${kpi('Stock value',peso(val),'fa-peso-sign','at retail price')}${kpi('Low stock',P.filter(p=>p.stock>0&&p.stock<=p.lowAt).length,'fa-battery-quarter')}${kpi('Out of stock',P.filter(p=>p.stock<=0).length,'fa-ban')}</div>
 <div class="card overflow-x-auto"><table class="w-full"><thead><tr><th class="th">Item</th><th class="th">Condition grade</th><th class="th">Stock</th><th class="th">Alert at</th><th class="th">Availability</th></tr></thead><tbody>${P.map(p=>`<tr><td class="td"><b>${esc(p.name)}</b><span class="block text-[10px] text-pinktheme-600/70">${esc(p.sku)}</span></td><td class="td"><select class="in !w-auto" onchange="upd(${p.id},'condition',this.value)">${CONDS.map(c=>`<option ${c==p.condition?'selected':''}>${c}</option>`).join('')}</select></td><td class="td"><div class="flex items-center gap-1"><button class="btn s !px-2.5" onclick="adj(${p.id},-1)">−</button><input type="number" min="0" class="in !w-16 text-center" value="${p.stock}" onchange="upd(${p.id},'stock',Math.max(0,+this.value||0))"><button class="btn s !px-2.5" onclick="adj(${p.id},1)">+</button></div></td><td class="td"><input type="number" min="0" class="in !w-16" value="${p.lowAt}" onchange="upd(${p.id},'lowAt',Math.max(0,+this.value||0))"></td><td class="td"><span class="chip ${avail(p)[1]}">${avail(p)[0]}</span>${p.status!='published'?' <span class="chip bg-gray-100 text-gray-600">hidden</span>':''}</td></tr>`).join('')}</tbody></table></div><p class="text-[11px] text-pinktheme-600/70 mt-2">Stock drops automatically when a storefront order is placed and is restored if you cancel the order. Sold-out items can’t be added to the cart.</p>`},

inquiries(){const f=Q.filter(q=>qf=='all'||(qf=='purchase'?q.type=='purchase':q.status==qf)),c=Q.find(q=>q.id==sel)||f[0];
 const T=['Thanks for reaching out! Yes, that item is available. Would you like us to reserve it for pickup?','Your order is being prepared and we’ll update you as soon as it ships.','Thanks for your message. Please bring your receipt to any Kate’s branch and we’ll gladly assist.'];
 return `${sampleBanner()}<div class="flex gap-1 mb-3 overflow-x-auto">${[['all','All'],['new','New'],['replied','Replied'],['resolved','Resolved'],['purchase','Purchase requests']].map(([k,l])=>`<button onclick="qf='${k}';sel=null;render()" class="btn ${qf==k?'p':'s'} whitespace-nowrap">${l} <span class="opacity-70">${Q.filter(q=>k=='all'||(k=='purchase'?q.type=='purchase':q.status==k)).length}</span></button>`).join('')}</div>
 <div class="grid lg:grid-cols-5 gap-4"><div class="card lg:col-span-2 max-h-[640px] overflow-y-auto">${f.map(q=>`<div onclick="sel='${q.id}';render()" class="p-3 border-b border-pinktheme-100 cursor-pointer hover:bg-pinktheme-50 ${c&&c.id==q.id?'bg-pinktheme-100':''}"><div class="flex justify-between gap-2"><b class="text-xs">${esc(q.name)}</b>${stChip(q.status)}</div><div class="text-[11px] text-pinktheme-700">${esc(q.concern)}${q.type=='purchase'?' · <i class="fa-solid fa-cart-shopping"></i>':''}</div><div class="text-[11px] text-pinktheme-600/70 truncate">${esc(q.message)}</div><div class="text-[10px] text-pinktheme-600/50 mt-1">${fd(q.createdAt)}${q.demo?' · sample':''}</div></div>`).join('')||empty('No inquiries here.')}</div>
 <div class="card lg:col-span-3 p-5">${c?`<div class="flex flex-wrap justify-between gap-2"><div><b>${esc(c.name)}</b><div class="text-[11px] text-pinktheme-600"><a class="underline" href="mailto:${esc(c.email)}">${esc(c.email)}</a> · <a class="underline" href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div></div><select class="in !w-auto" onchange="setQ('${c.id}',this.value)">${['new','replied','resolved'].map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></div>
 <div class="mt-3 text-[11px] font-bold text-pinktheme-600">${esc(c.concern)} · ${fd(c.createdAt)}</div><div class="mt-1 p-3 rounded-xl bg-pinktheme-50 text-xs whitespace-pre-wrap">${esc(c.message)}</div>
 ${(c.replies||[]).map(r=>`<div class="mt-2 p-3 rounded-xl bg-pinktheme-700 text-white text-xs ml-8 whitespace-pre-wrap">${esc(r.text)}<div class="text-[10px] opacity-70 mt-1">You · ${fd(r.at)}</div></div>`).join('')}
 <div class="mt-4"><div class="flex flex-wrap gap-1 mb-2">${T.map((t,i)=>`<button class="chip bg-pinktheme-100 hover:bg-pinktheme-200" onclick="$('#rt').value=T_[${i}]">Template ${i+1}</button>`).join('')}</div><textarea id="rt" rows="4" class="in" placeholder="Write a reply…"></textarea><div class="flex items-center justify-between mt-2 gap-2"><span class="text-[10px] text-pinktheme-600/70">Saves to this thread and opens your email app with the reply ready.</span><button class="btn p" onclick="reply('${c.id}')"><i class="fa-solid fa-paper-plane mr-1"></i> Send reply</button></div></div>`:empty('Select an inquiry to view it.')}</div></div>`},

sales(){const cut=range?Date.now()-range*864e5:0,o=O.filter(x=>new Date(x.createdAt)>=cut),l=o.filter(x=>x.status!='cancelled'),rev=sum(l),units=l.reduce((t,x)=>t+x.items.reduce((a,i)=>a+i.qty,0),0);
 const byP={},byC={};l.forEach(x=>x.items.forEach(i=>{byP[i.name]=byP[i.name]||{q:0,v:0};byP[i.name].q+=i.qty;byP[i.name].v+=i.price*i.qty;const p=P.find(z=>z.id==i.id),c=p?p.category:'other';byC[c]=(byC[c]||0)+i.price*i.qty}));
 const top=Object.entries(byP).sort((a,b)=>b[1].v-a[1].v).slice(0,5),cm=Math.max(1,...Object.values(byC));
 return `${sampleBanner()}<div class="flex gap-1 mb-3">${[[7,'7 days'],[30,'30 days'],[90,'90 days'],[0,'All time']].map(([n,l])=>`<button class="btn ${range==n?'p':'s'}" onclick="range=${n};render()">${l}</button>`).join('')}</div>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpi('Revenue',peso(rev),'fa-peso-sign')}${kpi('Orders',l.length,'fa-receipt',o.length-l.length+' cancelled')}${kpi('Avg. order',peso(l.length?rev/l.length:0),'fa-chart-line')}${kpi('Units sold',units,'fa-box-open')}</div>
 <div class="grid lg:grid-cols-3 gap-4 mb-4"><div class="card p-5 lg:col-span-2"><b class="text-sm">Daily revenue · last ${Math.min(range||30,30)} days</b><div class="mt-4">${bars(daily(Math.min(range||30,30),l))}</div></div>
 <div class="card p-5"><b class="text-sm">By category</b><div class="mt-3 space-y-2">${Object.entries(byC).map(([c,v])=>`<div class="text-xs"><div class="flex justify-between capitalize"><span>${c}</span><b>${peso(v)}</b></div><div class="h-2 rounded bg-pinktheme-100"><div class="h-2 rounded bg-pinktheme-600" style="width:${v/cm*100}%"></div></div></div>`).join('')||empty('No sales in this period.')}</div></div></div>
 <div class="grid lg:grid-cols-3 gap-4"><div class="card p-5"><b class="text-sm">Top products</b>${top.map(([n,d],i)=>`<div class="flex justify-between gap-2 py-2 border-t border-pinktheme-100 text-xs"><span class="truncate">${i+1}. ${esc(n)}</span><b>${d.q} · ${peso(d.v)}</b></div>`).join('')||empty('—')}</div>
 <div class="card lg:col-span-2 overflow-x-auto"><table class="w-full"><thead><tr><th class="th">Order</th><th class="th">Customer</th><th class="th">Fulfillment</th><th class="th">Total</th><th class="th">Status</th></tr></thead><tbody>${o.slice(0,25).map(x=>`<tr><td class="td"><b>${esc(x.id)}</b><span class="block text-[10px] text-pinktheme-600/70">${fd(x.createdAt)}${x.demo?' · sample':''}</span></td><td class="td">${esc(x.customer.name)}</td><td class="td">${x.fulfillment=='delivery'?'Delivery':'Pickup'}<span class="block text-[10px] text-pinktheme-600/70">${esc(x.payment)}</span></td><td class="td font-bold">${peso(x.total)}</td><td class="td"><select class="in !w-auto" onchange="setO('${x.id}',this.value)">${['processing','ready','completed','cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||`<tr><td colspan="5">${empty('No orders in this period.')}</td></tr>`}</tbody></table></div></div>`}
};
const T_=['Thanks for reaching out! Yes, that item is available. Would you like us to reserve it for pickup?','Your order is being prepared and we’ll update you as soon as it ships.','Thanks for your message. Please bring your receipt to any Kate’s branch and we’ll gladly assist.'];
const stChip=s=>`<span class="chip ${{new:'bg-pinktheme-600 text-white',replied:'bg-sky-100 text-sky-700',resolved:'bg-emerald-100 text-emerald-700'}[s]}">${s}</span>`;
const TABS=[['overview','fa-gauge','Overview'],['products','fa-box','Products'],['inventory','fa-cubes','Inventory'],['inquiries','fa-envelope','Inquiries'],['sales','fa-chart-column','Sales reports']];
function render(keepFocus){reload();if(!V[view])view='overview';
 $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<a href="#${k}" class="btn whitespace-nowrap ${view==k?'p':'s'}"><i class="fa-solid ${i} mr-1"></i>${l}${k=='inquiries'&&Q.some(q=>q.status=='new')?` <span class="ml-1 chip bg-white text-pinktheme-700">${Q.filter(q=>q.status=='new').length}</span>`:''}</a>`).join('');
 const a=document.activeElement,id=a&&a.id;$('#main').innerHTML=V[view]();if(keepFocus&&id){const e=document.getElementById(id);if(e){e.focus();e.setSelectionRange?.(e.value.length,e.value.length)}}}
const upd=(id,k,v)=>{const p=P.find(x=>x.id==id);p[k]=v;put('kate_catalog',P);render()},adj=(id,d)=>upd(id,'stock',Math.max(0,P.find(x=>x.id==id).stock+d));
function setQ(id,s){Q.find(q=>q.id==id).status=s;put('kate_inquiries',Q);render()}
function reply(id){const t=$('#rt').value.trim();if(!t)return toast('Write a reply first');const q=Q.find(x=>x.id==id);(q.replies=q.replies||[]).push({at:new Date().toISOString(),text:t});q.status='replied';put('kate_inquiries',Q);render();
 location.href='mailto:'+q.email+'?subject='+encodeURIComponent('Re: '+q.concern)+'&body='+encodeURIComponent(t);toast('Reply saved')}
function setO(id,s){const o=O.find(x=>x.id==id);if(s=='cancelled'&&!o.restocked&&!o.demo){o.items.forEach(i=>{const p=P.find(x=>x.id==i.id);if(p)p.stock+=i.qty});o.restocked=true;put('kate_catalog',P)}
 else if(o.status=='cancelled'&&s!='cancelled'&&o.restocked){o.items.forEach(i=>{const p=P.find(x=>x.id==i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)});o.restocked=false;put('kate_catalog',P)}
 o.status=s;put('kate_orders',O);render()}
function delP(id){const p=P.find(x=>x.id==id);if(confirm(`Delete “${p.name}”? This removes it from the storefront.`)){P=P.filter(x=>x.id!=id);put('kate_catalog',P);render();toast('Product deleted')}}
function editP(id){const p=id?P.find(x=>x.id==id):{name:'',category:'smartphones',condition:CONDS[0],price:'',originalPrice:'',stock:1,lowAt:3,status:'published',badge:'',description:'',specs:'',image:''};
 const f=(l,i,v,t='text')=>`<div><label class="lb">${l}</label><input id="f_${i}" type="${t}" class="in" value="${esc(v)}"></div>`,sl=(l,i,o,v)=>`<div><label class="lb">${l}</label><select id="f_${i}" class="in">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></div>`;
 $('#modal').innerHTML=`<div class="bg-white rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto p-6"><div class="flex justify-between mb-4"><b>${id?'Edit':'Add'} product</b><button onclick="closeM()"><i class="fa-solid fa-xmark"></i></button></div>
 <div class="grid sm:grid-cols-2 gap-3"><div class="sm:col-span-2">${f('Name','name',p.name)}</div>${sl('Category','category',CATS,p.category)}${sl('Condition grade','condition',CONDS,p.condition)}${f('Price (₱)','price',p.price,'number')}${f('Original price (₱)','originalPrice',p.originalPrice||'','number')}${f('Stock','stock',p.stock,'number')}${sl('Listing','status',['published','draft'],p.status)}${f('Badge (optional, e.g. SALE)','badge',p.badge||'')}
 <div><label class="lb">Photo</label><div class="flex items-center gap-2"><img id="pv" src="${esc(p.image)}" class="w-12 h-12 rounded-lg object-cover bg-pinktheme-50 border border-pinktheme-100"><input type="file" accept="image/*" onchange="photo(this)" class="text-[11px] w-full"></div><input id="f_image" type="hidden" value="${esc(p.image)}"></div>
 <div class="sm:col-span-2"><label class="lb">Description</label><textarea id="f_description" rows="2" class="in">${esc(p.description)}</textarea></div><div class="sm:col-span-2"><label class="lb">Specs (one per line, “Label: Value”)</label><textarea id="f_specs" rows="4" class="in">${esc(p.specs)}</textarea></div></div>
 <div class="flex justify-end gap-2 mt-5"><button class="btn s" onclick="closeM()">Cancel</button><button class="btn p" onclick="saveP(${id||0})">Save product</button></div></div>`;$('#modal').classList.replace('hidden','flex')}
const closeM=()=>$('#modal').classList.replace('flex','hidden');
function photo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);$('#f_image').value=u;$('#pv').src=u};im.src=r.result};r.readAsDataURL(f)}
function saveP(id){const g=k=>$('#f_'+k).value.trim(),name=g('name'),price=+g('price');if(!name||!(price>0))return toast('Name and a price are required');
 const d={name,category:g('category'),condition:g('condition'),price,originalPrice:+g('originalPrice')||0,stock:Math.max(0,+g('stock')||0),status:g('status'),badge:g('badge'),description:g('description'),specs:g('specs'),image:g('image')||'kate1.avif'};
 if(id)Object.assign(P.find(x=>x.id==id),d);else{const n=Math.max(0,...P.map(x=>x.id))+1;P.push({id:n,sku:'KOG-'+String(n).padStart(3,'0'),lowAt:3,rating:5,reviewsCount:0,...d})}
 if(put('kate_catalog',P)){closeM();render();toast('Product saved')}}
function addSample(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647,pick=a=>a[Math.floor(r()*a.length)];
 const N=['Maria Santos','Juan dela Cruz','Angel Reyes','Carlo Mendoza','Bea Villanueva','Paolo Garcia','Nina Cruz','Miguel Torres','Jessa Ramos','Kevin Lim'],B=['Greenhills Flagship','SM Megamall Cyberzone','SM Lanang Premier','Abreeza Mall','SM City Cebu'],Y=['GCash','Cash on Delivery','In-Store Cash/Card','Bank Transfer'];
 const os=[];for(let i=0;i<40;i++){const d=new Date(Date.now()-r()*30*864e5),it=[];for(let j=0;j<(r()<.25?2:1);j++){const p=pick(P);it.push({id:p.id,name:p.name,price:p.price,qty:1})}
  const del=r()<.4;os.push({id:'KOG-'+(100000+Math.floor(r()*899999)),createdAt:d.toISOString(),customer:{name:pick(N),phone:'09'+String(Math.floor(r()*1e9)).padStart(9,'0')},items:it,total:it.reduce((t,x)=>t+x.price*x.qty,0)+(del?150:0),fulfillment:del?'delivery':'pickup',branch:del?'Home Delivery':pick(B),payment:pick(Y),status:r()<.08?'cancelled':Date.now()-d>3*864e5?'completed':'processing',demo:true})}
 const qs=[['Stock & Availability','Hi! Is the iPad Pro M5 available in Space Black at SM Megamall? I’d like to pick it up Saturday.','purchase'],['Order Status & Delivery','My order shipped 3 days ago, can I get a tracking number?'],['Store Pickup Inquiry','Can I reserve AirPods Pro 3 and pay on pickup in Abreeza?','purchase'],['Device Warranty & Service','How long is the warranty on the pre-owned iPhone 16?'],['Other Concerns','Do you accept trade-ins for an older iPhone?'],['Stock & Availability','Any AirPods Max (Midnight) coming back in stock soon?','purchase']].map((q,i)=>({id:'Q'+Date.now()+i,createdAt:new Date(Date.now()-i*7e6-3e6).toISOString(),name:N[i],email:N[i].split(' ')[0].toLowerCase()+'@example.ph',phone:'0955 123 000'+i,concern:q[0],message:q[1],type:q[2]||'message',status:i==3?'replied':i==4?'resolved':'new',replies:[],demo:true}));
 put('kate_orders',[...os,...O].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));put('kate_inquiries',[...Q,...qs].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)));render();toast('Sample data loaded')}
function clearSample(){put('kate_orders',O.filter(o=>!o.demo));put('kate_inquiries',Q.filter(q=>!q.demo));render();toast('Sample data removed')}
addEventListener('hashchange',()=>{view=location.hash.slice(1)||'overview';sel=null;render()});
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('kate_')&&$('#modal').classList.contains('hidden')&&!document.activeElement.matches('input,textarea,select'))render()});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
render();
</script>
</body>
