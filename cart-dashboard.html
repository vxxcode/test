<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Cart - Kate's</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#FFF5F8] p-6"><h1 class="text-2xl font-black text-pinktheme-900 mb-4">Shopping Cart</h1><div id="cartList"></div><div id="total" class="mt-4 font-bold"></div><a href="index.html" class="inline-block mt-4 text-pinktheme-700">Continue Shopping</a><script>function render(){let c=JSON.parse(localStorage.getItem('kate_cart')||'[]');const el=document.getElementById('cartList');if(!c.length){el.innerHTML='<p>Empty cart</p>';document.getElementById('total').innerText='';return;}let t=0;el.innerHTML=c.map(i=>{const p=i.price*i.quantity;t+=p;return `<div class="flex gap-3 p-3 bg-white rounded-xl mb-2"><img src="${i.image}" class="w-12 h-12"><div><div>${i.name}</div><div>₱${i.price} x ${i.quantity} = ₱${p.toFixed(2)}</div><button onclick="rm('${i.id}')">Remove</button></div></div>`;}).join('');document.getElementById('total').innerText='Total: ₱'+t.toFixed(2);}function rm(id){let c=JSON.parse(localStorage.getItem('kate_cart')||'[]');c=c.filter(i=>i.id!=id);localStorage.setItem('kate_cart',JSON.stringify(c));render();}render();</script></body></html>
