<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Transactions - Kate's</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#FFF5F8] p-6"><h1 class="text-2xl font-black mb-4">Transaction History (TEST/DEMO)</h1><div id="list"></div><script>const orders=JSON.parse(localStorage.getItem('kate_orders')||'[]');const el=document.getElementById('list');if(!orders.length)el.innerHTML='<p>No transactions</p>';else el.innerHTML=orders.map(o=>`<div class="bg-white p-3 rounded-xl mb-2"><div>${o.id}</div><div>${o.createdAt}</div><div>₱${o.total}</div><div>${o.status}</div></div>`).join('');</script></body></html>
